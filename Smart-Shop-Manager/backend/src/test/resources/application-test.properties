# Test profile configuration for Spring Boot test suites using in-memory H2
spring.datasource.url=jdbc:h2:mem:smartshop;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Test JWT secret (must be at least 256 bits / 32 characters)
jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long
jwt.expiration-ms=86400000

# Initial admin test credentials (must pass DataInitializer validation: >= 8 characters and non-default)
admin.username=admin
admin.password=SecureTestAdminPass123!