# Example configuration file for Smart Shop Manager Backend
# Copy this file to application-local.properties (which is gitignored)
# or provide these variables via environment variables.

# Application
spring.application.name=backend
server.port=8081

# Database Configuration
# In production / local dev, supply DB_PASSWORD in your environment or application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop_manager}
spring.datasource.username=${DB_USERNAME:shop_manager_user}
spring.datasource.password=${DB_PASSWORD:your_mysql_password_here}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Security Configuration
# JWT_SECRET must be at least 256 bits (32 characters/bytes)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:0.0.1}

# Initial Admin Credentials
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
