spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shop_manager}
spring.datasource.username=${DB_USERNAME:shop_manager_user}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port=8081

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000}

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:0.0.1}